services:
  firefox:
    image: jlesage/firefox:latest
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5800"
    environment:
      WEB_AUDIO: "${WEB_AUDIO}"
      WEB_FILE_MANAGER: "${WEB_FILE_MANAGER}"
      TZ: "${FIREFOX_TZ}"
      LANG: "${FIREFOX_LANG}"
      ENABLE_CJK_FONT: "${ENABLE_CJK_FONT}"
      KEEP_APP_RUNNING: "${KEEP_APP_RUNNING}"
    volumes:
      - ./config:/config
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
