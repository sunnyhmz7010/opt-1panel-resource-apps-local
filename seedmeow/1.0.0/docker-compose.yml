services:
  seedmeow:
    image: ghcr.io/sunnyhmz7010/seedmeow:1.0.0
    container_name: "${CONTAINER_NAME}"
    restart: always
    stop_grace_period: 60s
    networks:
      - 1panel-network
    environment:
      SOURCES: "${SOURCES}"
      NODESEEK_MEOW_NICKNAME: "${NODESEEK_MEOW_NICKNAME}"
      NODESEEK_CHECK_INTERVAL_SECONDS: "${NODESEEK_CHECK_INTERVAL_SECONDS}"
      NODESEEK_KEYWORDS: "${NODESEEK_KEYWORDS}"
      NODESEEK_KEYWORD_GROUPS: "${NODESEEK_KEYWORD_GROUPS}"
      NODESEEK_REGEX_PATTERNS: "${NODESEEK_REGEX_PATTERNS}"
      NODESEEK_PUSH_CATEGORY: "${NODESEEK_PUSH_CATEGORY}"
      NODESEEK_CATEGORIES: "${NODESEEK_CATEGORIES}"
      NODESEEK_BLOCK_KEYWORDS: "${NODESEEK_BLOCK_KEYWORDS}"
      NODESEEK_MATCH_SCOPE: "${NODESEEK_MATCH_SCOPE}"
      NODESEEK_PUSH_EXISTING: "${NODESEEK_PUSH_EXISTING}"
      NODESEEK_SHOW_LINK_URL: "${NODESEEK_SHOW_LINK_URL}"
      NODESEEK_HEALTH_CHECK_MINUTES: "${NODESEEK_HEALTH_CHECK_MINUTES}"
      SB_MEOW_NICKNAME: "${SB_MEOW_NICKNAME}"
      SB_CHECK_INTERVAL_SECONDS: "${SB_CHECK_INTERVAL_SECONDS}"
      SB_KEYWORDS: "${SB_KEYWORDS}"
      SB_KEYWORD_GROUPS: "${SB_KEYWORD_GROUPS}"
      SB_REGEX_PATTERNS: "${SB_REGEX_PATTERNS}"
      SB_PUSH_CATEGORY: "${SB_PUSH_CATEGORY}"
      SB_CATEGORIES: "${SB_CATEGORIES}"
      SB_BLOCK_KEYWORDS: "${SB_BLOCK_KEYWORDS}"
      SB_MATCH_SCOPE: "${SB_MATCH_SCOPE}"
      SB_PUSH_EXISTING: "${SB_PUSH_EXISTING}"
      SB_SHOW_LINK_URL: "${SB_SHOW_LINK_URL}"
      SB_HEALTH_CHECK_MINUTES: "${SB_HEALTH_CHECK_MINUTES}"
    volumes:
      - ./data:/app/data
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
