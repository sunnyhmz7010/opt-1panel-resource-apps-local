services:
  mmwx-komari-adapter:
    image: ghcr.io/sunnyhmz7010/mmwx-probe-komari-theme-adapter:2.1.4
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      MMWX_ORIGIN: "${MMWX_ORIGIN}"
      PROBE_TOKEN: "${PROBE_TOKEN}"
      THEME_REPO: "${THEME_REPO}"
      THEME_REF: "${THEME_REF}"
      THEME_GIT_PROXY: "${THEME_GIT_PROXY}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
